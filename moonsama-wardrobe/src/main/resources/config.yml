# MoonsamaWardrobe configuration.
#
# The wardrobe renders a skin from NFT parts (skin-compositor) and needs it Mojang-signed
# before a player can wear it. Signing is done by MoonsamaCore through MineSkin; set
# MINESKIN_API_KEY in MoonsamaCore's environment. Without it the wardrobe opens but cannot
# apply looks.

# Portal collections that can be customized (must be composable: moonsama, exosama).
collections:
  - moonsama
  - exosama

# Customizable slots that are not offered. Backgrounds and companions never show up on a
# Minecraft skin, so they are hidden by default.
hidden-slots:
  - background
  - companion

# Parts whose only unlock was a Multiverse Costume / Background NFT. Portal does not index
# those contracts, so the wardrobe cannot check them.
#   locked - keep them unavailable (default; nobody gets the old paid costumes for free)
#   free   - every linked player may use them
parts-outside-portal: locked

# Display names for collections in messages.
collection-names:
  moonsama: Moonsama
  exosama: Exosama
