name: Security scan

# Trivy vulnerability scans, reported to the repository's Security tab (code
# scanning). Informational only: nothing here blocks a merge or a release.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays, after Dependabot's weekly run
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  repository:
    name: Repository (dependencies, config, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-repository

  paper-image:
    name: Paper server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the dev-stack image
        run: docker compose -p kit build paper
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: kit-paper
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-paper-image
