# MoonsamaWhaleBuffs configuration.
#
# "Moon Power" is computed from the NFTs a linked player holds in Portal. Power gives extra
# max health, extra melee damage, a coloured name and - above a threshold - the Whale
# Scepter, which activates Whale Mode. Defaults are the legacy server's numbers.

enabled: true

skins:
  # Buffs only apply while the player wears an NFT skin (MoonsamaSkins) from one of these
  # collections - the legacy rule. Set to false to buff every linked holder.
  require-entitled-skin: true
  collections: [moonsama, exosama]

power:
  # Power per token held, by Portal collection slug.
  per-token:
    moonsama: 10
    exosama: 1
  # Specific tokens worth a different amount (replaces the per-token value).
  # The six Neon-dimension Moonsamas were worth 100 each.
  overrides:
    - collection: moonsama
      token-ids: [276, 511, 545, 605, 787, 920]
      power: 100

# Extra max health per point of power (0.1 → 100 power = +10 HP = 5 hearts).
health-per-power: 0.1
# Extra damage per point of power (0.025 → 100 power = +250 %).
damage-per-power: 0.025

# Name colour in chat and the player list by power. `rainbow` cycles colours per letter.
# Players below the lowest tier keep their normal name.
names:
  enabled: true
  tiers:
    - min-power: 1
      color: gold
    - min-power: 50
      color: blue
    - min-power: 100
      color: light_purple
    - min-power: 200
      color: rainbow

whale-mode:
  enabled: true
  # Players with at least this much power receive the Whale Scepter (a bound feather).
  scepter-min-power: 100
  # Right-click the scepter: Whale Mode for this long, then a cooldown.
  duration-seconds: 120
  cooldown-seconds: 300
  # Max health (including the power bonus) is multiplied by this during Whale Mode.
  health-multiplier: 1.5
  # Lightning on activation: effect (visual only), real (vanilla strikes, can hurt), none.
  lightning: effect
  scepter:
    material: FEATHER
    custom-model-data: 2
    name: "<light_purple>Whale Scepter</light_purple>"
