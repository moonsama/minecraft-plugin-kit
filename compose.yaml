services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile.paper
      args:
        PAPER_URL: https://fill-data.papermc.io/v1/objects/49399919246cbf443efc8507447dc948eb7477c41be560b0e87e2a455aff824a/paper-26.3-40.jar
        PAPER_SHA256: 49399919246cbf443efc8507447dc948eb7477c41be560b0e87e2a455aff824a
    ports:
      - '25565:25565'
      - '8080:8080'
    environment:
      PORTAL_API_URL: ${PORTAL_API_URL:-https://portal-api.moonsama.com}
      PORTAL_WEB_URL: ${PORTAL_WEB_URL:-https://portal.moonsama.com}
      PORTAL_API_KEY: ${PORTAL_API_KEY:-}
      PORTAL_API_SECRET: ${PORTAL_API_SECRET:-}
      PORTAL_OAUTH_CLIENT_ID: ${PORTAL_OAUTH_CLIENT_ID:-}
      PORTAL_OAUTH_CLIENT_SECRET: ${PORTAL_OAUTH_CLIENT_SECRET:-}
      PORTAL_OAUTH_REDIRECT_URI: ${PORTAL_OAUTH_REDIRECT_URI:-http://127.0.0.1:8080/callback}
      PORTAL_CALLBACK_BIND_HOST: 0.0.0.0
      PORTAL_CALLBACK_PORT: 8080
      PORTAL_SPEND_ENABLED: ${PORTAL_SPEND_ENABLED:-false}
      PORTAL_REWARD_ENABLED: ${PORTAL_REWARD_ENABLED:-false}
      PORTAL_REFUND_ENABLED: ${PORTAL_REFUND_ENABLED:-false}
      PORTAL_HOLDS_ENABLED: ${PORTAL_HOLDS_ENABLED:-false}
      MINESKIN_API_KEY: ${MINESKIN_API_KEY:-}
      # ./dev-data is a bind mount (virtiofs on Docker Desktop); WAL's shared-memory mmap can SIGBUS there.
      MOONSAMA_SQLITE_JOURNAL_MODE: ${MOONSAMA_SQLITE_JOURNAL_MODE:-truncate}
    volumes:
      - ./dev-data:/data
      - ./build/dist/plugins/MoonsamaCore.jar:/data/plugins/MoonsamaCore.jar:ro
      - ./build/dist/plugins/MoonsamaSkins.jar:/data/plugins/MoonsamaSkins.jar:ro
      - ./build/dist/plugins/MoonsamaItems.jar:/data/plugins/MoonsamaItems.jar:ro
      - ./build/dist/plugins/MoonsamaWardrobe.jar:/data/plugins/MoonsamaWardrobe.jar:ro
      - ./build/dist/plugins/MoonsamaGatekeeper.jar:/data/plugins/MoonsamaGatekeeper.jar:ro
      - ./build/dist/plugins/MoonsamaWhaleBuffs.jar:/data/plugins/MoonsamaWhaleBuffs.jar:ro
      - ./build/dist/plugins/MoonsamaOffhandDemo.jar:/data/plugins/MoonsamaOffhandDemo.jar:ro
      - ./build/dist/resourcepack.zip:/data/plugins/MoonsamaCore/resourcepack.zip:ro
    stdin_open: true
    tty: true
